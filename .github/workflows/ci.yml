name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-compile:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff lint
        run: ruff check .

      - name: Compile-check all Python sources
        run: python -m compileall -q app.py ui.py src scripts

  # `dep-audit` (pip-audit --strict) was removed during active development —
  # new CVEs published against pinned versions kept blocking unrelated PRs
  # without protecting any users (this project isn't deployed). Bring the
  # job back before the first real deployment: re-add the `dep-audit` block
  # here, triage the accumulated ignores (langchain ecosystem + starlette +
  # flask-cors), and re-list the job under required status checks in the
  # main-branch ruleset.

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks needs full history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Install only what the tests need. tests/ targets pure-function helpers
      # (tokenizers, observability) that don't import langchain/milvus/etc., so
      # we skip the heavy runtime install. If a test ever needs more, install
      # requirements.txt here instead.
      # Imports chain: tests -> src.utils.observability -> src.utils.config
      # -> python-dotenv. We install the transitive deps the import graph
      # actually needs, rather than the full requirements.txt (which would
      # pull in langchain/milvus/fastapi and slow CI considerably).
      - name: Install test deps
        run: pip install -r requirements-dev.txt tiktoken==0.7.0 'langfuse>=4.6.1,<5' python-dotenv==1.0.1 pyyaml==6.0.2

      - name: Run pytest
        run: pytest tests/ -v

  eval-dataset-validate:
    name: Eval dataset shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # --validate-only is a pure-Python sanity check on eval/qa_set.jsonl —
      # no network, no LLM. Cheap PR-time gate so a malformed JSONL line
      # (missing field, bad JSON) never lands on main. The real eval runs
      # locally on demand against a live app.
      - name: Install validator deps
        run: pip install python-dotenv==1.0.1 pyyaml==6.0.2

      - name: Validate qa_set.jsonl
        run: python -m eval.run_eval --validate-only
