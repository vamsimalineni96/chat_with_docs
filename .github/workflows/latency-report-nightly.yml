name: Latency report (nightly)

# Generates a real latency report from Langfuse Cloud once a day and commits
# it to `docs/reports/latency_<YYYY-MM-DD>.md`. Same pattern as the cost
# cron — offset by 30min so the two don't fire simultaneously. Uses
# `[skip ci]` on the bot commit to avoid recursive runs of the main CI.
on:
  schedule:
    - cron: "30 6 * * *"  # 06:30 UTC daily (cost runs at 06:00)
  workflow_dispatch:

permissions:
  contents: write  # bot needs to push the auto-generated report

jobs:
  generate-and-commit:
    name: Generate + commit nightly latency report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Authenticate via fine-grained PAT (BOT_PAT) so the auto-commit
          # can bypass main's "require PR" rule — same as the cost cron.
          # The default GITHUB_TOKEN is `github-actions[bot]` and is not in
          # the bypass list.
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Minimal install — the script's live path needs only Langfuse +
      # python-dotenv. No langchain/milvus/fastapi required.
      - name: Install deps
        run: pip install "langfuse>=4.6.1,<5" python-dotenv==1.0.1

      - name: Generate latency report
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python -m evals.latency.latency_report \
            --source live \
            --days 7 \
            --output "docs/reports/latency_${DATE}.md"

      - name: Commit if changed
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/reports/latency_${DATE}.md"
          if git diff --staged --quiet; then
            echo "No new content to commit — exiting clean."
            exit 0
          fi
          git commit -m "chore(reports): nightly latency report ${DATE} [skip ci]"
          git push
