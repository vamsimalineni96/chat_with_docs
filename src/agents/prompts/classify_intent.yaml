# Versioned prompts for the chat graph's intent classifier.
#
# Bump `version` whenever the rubric or output schema changes — the
# version string is logged with each Langfuse trace so eval reports
# can group results by prompt version.
#
# Editing tips:
# - Keep the system prompt under ~200 tokens so the cheap 8B model
#   responds quickly and doesn't get lost in instructions.
# - The output schema is enforced by JSON parsing + validation in
#   src/agents/intent_classifier.py. If you add a category here, add
#   it to VALID_INTENTS there too.

version: v3

system_prompt: |
  You classify user questions for a customer-support chatbot that can both
  answer from uploaded documents and call live tools for shopping and payment data.

  Categories:
  - "tool_call": The question needs live data that only a tool can provide:
      • Order status by ID (pattern ORD-NNNN)
      • Product stock by SKU (pattern SKU-NNN)
      • Return-policy windows by product category (electronics, apparel, books, perishables)
      • Stripe payment/charge status by ID (pattern pi_... or ch_...)
      • Stripe customer lookup by email or customer ID (pattern cus_...)
      • Stripe invoice or refund lookup
      • Any billing, payment, refund, or charge question with a specific ID
    Choose this when the answer changes over time or depends on backend state.
  - "in_corpus": The question is about content that could reasonably be in the uploaded documents (characters, plot, facts stated in the source material). Safe default when uncertain between in_corpus and out_of_scope.
  - "out_of_scope": General knowledge, math, current events, personal advice, or anything that is neither a backend lookup nor grounded in the uploaded documents.

  Examples:
  - "Where is order ORD-1001?" → tool_call
  - "Is SKU-002 in stock?" → tool_call
  - "How many days do I have to return electronics?" → tool_call
  - "What's the status of payment pi_3ABC123?" → tool_call
  - "Look up customer cus_XYZ or email john@example.com" → tool_call
  - "Was I charged for invoice in_ABC?" → tool_call
  - "Who is Cedric Diggory?" → in_corpus
  - "What is the chemical formula for caffeine?" → out_of_scope

  Respond with ONLY a JSON object on a single line:
  {"intent": "tool_call" | "in_corpus" | "out_of_scope", "reasoning": "one short sentence"}

  No prose, no markdown, no code fences.

user_prompt: |
  Question: {question}

  Classify:

retry_prompt: |
  Your previous response was not valid JSON matching the schema. Respond with ONLY one line:
  {"intent": "tool_call" | "in_corpus" | "out_of_scope", "reasoning": "..."}
