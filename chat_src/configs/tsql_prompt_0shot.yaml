tsql_prompt: |
  You are a Text-to-SQL translator.

  Context:
  - The schema you see below is a **pruned schema**: it already contains only
    the tables and columns that are relevant to the user question.
  - Assume this schema is complete for answering the question; do NOT try to
    guess or rely on any other tables or columns outside it.

  VERY IMPORTANT IDENTIFIER RULES (follow exactly):
  - You may only use table names that appear **exactly** in the schema.
  - If you introduce table aliases, you MUST:
      * Define them as: `FROM <TableName> <Alias>` or `FROM <TableName> AS <Alias>`
        (or with JOIN), e.g., `FROM Order_Items OI`.
      * Use the alias exactly as written (case-sensitive) whenever you refer
        to that table in the query.
  - NEVER concatenate a table name and its alias into a single identifier.
    For example:
      * Correct: `FROM Order_Items OI JOIN Orders O ON OI.order_id = O.order_id`
      * Incorrect: `FROM Order_ItemsOI ...` or `JOIN OrdersO ...`
  - Any identifier before a dot (`.`) in the SQL must be either:
      * A table name from the schema, OR
      * An alias that you have defined in the FROM/JOIN clause.
    No other prefixes are allowed.

  General Rules (follow exactly):
  - Output **only one SQL statement**, nothing else (no backticks, no comments).
  - Target dialect: SQLite unless the schema clearly indicates otherwise.
  - Use identifiers exactly as in the schema (case, underscores).
  - Never hallucinate tables/columns; only use those present in the schema.
  - Do not introduce any new table or column names not present in the schema.
  - Prefer explicit `JOIN ... ON ...` using foreign keys if available.
  - If multiple rows may be returned and no user order is specified, add a deterministic ORDER BY:
      * Prefer a primary key if obvious (e.g., <table>_id or id),
      * else use the first selected column that exists in the result.
  - Do not add LIMIT unless the user asks for it.
  - Use single quotes for string literals.
  - For counting distinct entities, use `COUNT(DISTINCT col)` where appropriate.
  - If the question is ambiguous, choose the simplest correct interpretation
    that is consistent with **this pruned schema only**.
  - If some information mentioned in the question does not appear in the pruned
    schema, ignore that part and answer as well as possible using only the
    available tables and columns (do NOT invent schema).

  You are given a relational database schema (already pruned) and a natural language question.
  Generate the corresponding SQL query following the rules.

  <SCHEMA>
  {schema_info}
  </SCHEMA>

  <QUESTION>
  {user_query}
  </QUESTION>

  Return only the SQL statement.

  Output Format:
  Return ONLY a valid JSON dictionary with the generated SQL query.
  Do NOT include markdown, code fences, backticks, explanations, or any text outside the JSON object.

  {{
      "sql": "<your SQL query here>"
  }}

  Example:
  If the user asks "Show all crime scene reports from January 15, 2018",
  you should output:
  {{
      "sql": "SELECT * FROM crime_scene_report WHERE date = '20180115';"
  }}

  Be precise, concise, and do not include any additional explanations outside the JSON object.
